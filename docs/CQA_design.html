<!doctype html>
<!-- CQA: макет дизайна для разработчиков. Статичная страница: сервера и ИИ нет, все данные условные.
     Экраны: #dialogs, #analysis, #checklists, #appeals, #analytics. Рабочая ширина: 1440 x 900. -->
<html lang="ru"><head><meta charset="utf-8"><title>CQA: примеры дизайна</title>
<style>
:root{--text:#fff;--muted:#A7B3AE;--green:#3DEB8F;--green2:#12B981;--teal:#2FD6B4;--mint:#A9F5DC;--purple:#A855F7;--pink:#E04FD0;--amber:#FFC24B;--red:#FF5470;--blue:#5AA9FF;--glass:rgba(255,255,255,.06);--edge:rgba(255,255,255,.11)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{color:var(--text);font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;overflow:hidden;background:
radial-gradient(1px 1px at 12% 22%,#fff8,transparent),radial-gradient(1.5px 1.5px at 38% 8%,#fff6,transparent),radial-gradient(1px 1px at 63% 18%,#fff7,transparent),radial-gradient(1.5px 1.5px at 88% 40%,#fff5,transparent),radial-gradient(1px 1px at 72% 82%,#fff6,transparent),radial-gradient(1.5px 1.5px at 30% 90%,#fff5,transparent),
radial-gradient(760px 480px at 92% -8%,rgba(18,185,129,.5),transparent 70%),radial-gradient(640px 520px at 8% 108%,rgba(139,62,247,.34),transparent 70%),radial-gradient(520px 420px at 58% 112%,rgba(47,214,180,.2),transparent 70%),#04100C}
.side{width:224px;flex:none;padding:24px 14px;display:flex;flex-direction:column;background:rgba(0,0,0,.28);border-right:1px solid var(--edge)}
.logo{display:flex;align-items:center;gap:11px;font-size:25px;font-weight:800;padding:0 8px 24px}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#6CF5B1,#0F9D6E);box-shadow:0 8px 22px rgba(18,185,129,.55),inset 0 1px 1px #fff9;display:flex;align-items:center;justify-content:center}
.nav a{display:flex;gap:12px;align-items:center;padding:9px;border-radius:17px;color:#D5DEDA;font-weight:600;margin-bottom:6px;border:1px solid transparent}
.nav a.on{background:linear-gradient(100deg,rgba(61,235,143,.24),rgba(61,235,143,.05));border-color:rgba(61,235,143,.42);color:#fff;box-shadow:0 8px 26px rgba(18,185,129,.24)}
.tile3d{width:38px;height:38px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.18)}
.tile3d svg{width:21px;height:21px}
.g{background:linear-gradient(145deg,#6CF5B1,#0F9D6E)}.t{background:linear-gradient(145deg,#7FF0E0,#149C9A)}.p{background:linear-gradient(145deg,#D08CFF,#7B2FF0)}.a{background:linear-gradient(145deg,#FFD978,#F0902B)}.r{background:linear-gradient(145deg,#FF9AA8,#E32950)}.b{background:linear-gradient(145deg,#9DCBFF,#2F73E0)}
.role{margin-top:auto;padding:12px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.role b{display:block;color:#fff;font-size:14px}
.main{flex:1;min-width:0;padding:22px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{font-size:33px;font-weight:800;line-height:1.1;letter-spacing:-.3px}
.chips{display:flex;gap:7px;margin-top:7px}
.chip{padding:3px 11px;border-radius:99px;background:var(--glass);border:1px solid var(--edge);font-size:13px;color:#DDE5E1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:10px 17px;border-radius:99px;font-weight:700;white-space:nowrap;background:var(--glass);border:1px solid var(--edge)}
.grad{background:linear-gradient(95deg,#B14DF5,#E04FD0);border:0;box-shadow:0 8px 24px rgba(177,77,245,.45)}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:26px;padding:18px 20px;backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.25)}
.card h2{font-size:18px;font-weight:700;margin-bottom:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:99px;font-weight:700;white-space:nowrap;flex:1}
.go{background:linear-gradient(95deg,#0FB57C,#38E39B);color:#04261A;box-shadow:0 10px 26px rgba(18,185,129,.45)}
.dis{background:linear-gradient(95deg,#B14DF5,#E04FD0);box-shadow:0 10px 26px rgba(177,77,245,.38)}
/* Плеер */
.pw{position:relative}
.track{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;font-weight:700;font-size:14px;height:41px}
.who{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%}
.wave{height:39px;display:flex;align-items:center;gap:2px;overflow:hidden}.wave i{flex:1;border-radius:3px;min-width:1px}
.frag{position:absolute;top:-2px;bottom:-2px;left:calc(104px + (100% - 104px)*.35);width:calc((100% - 104px)*.13);background:rgba(255,194,75,.15);border:1.5px solid var(--amber);border-radius:12px;box-shadow:0 0 22px rgba(255,194,75,.4)}
.ctl{display:flex;align-items:center;gap:14px;margin-top:9px}
.play{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#6CF5B1,#0F9D6E);display:flex;align-items:center;justify-content:center;padding-left:3px;color:#04261A;font-size:15px;box-shadow:0 6px 20px rgba(18,185,129,.6)}
.prog{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.15);position:relative}
.prog b{position:absolute;inset:0 65% 0 0;background:linear-gradient(90deg,#2FD6B4,#3DEB8F);border-radius:9px}
.prog u{position:absolute;left:35%;top:-6px;width:18px;height:18px;border-radius:50%;background:#fff;margin-left:-9px;box-shadow:0 0 14px var(--green)}
/* Чат */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
.msg{display:flex;gap:9px;margin-bottom:11px;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.av{width:32px;height:32px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;box-shadow:inset 0 1px 1px #fff8}
.bub{padding:10px 14px;border-radius:18px 18px 18px 5px;background:rgba(255,255,255,.09);max-width:82%}
.msg.me .bub{border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,rgba(18,185,129,.5),rgba(47,214,180,.26))}
.bub small{display:block;font-size:12px;color:#C4D0CB;margin-bottom:1px}
.msg.hl .bub{background:linear-gradient(135deg,rgba(255,194,75,.42),rgba(255,140,60,.2));box-shadow:0 0 0 1.5px var(--amber),0 0 26px rgba(255,194,75,.4)}
.ev{display:inline-block;font-size:11px;font-weight:800;color:#3A2600;background:var(--amber);padding:1px 8px;border-radius:99px;margin-left:6px}
/* Счёт */
.hero{border-radius:22px;padding:15px 20px;display:flex;align-items:center;gap:20px;background:linear-gradient(110deg,#0FA57A,#35CFA3 58%,#A9F5DC);position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(18,185,129,.35)}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffffb0,#ffffff18 60%,transparent 70%)}
.ring{position:relative;width:108px;height:108px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:30px;line-height:1;font-weight:800}.ring span{font-size:12px;opacity:.9}
.hero h3{font-size:22px;font-weight:800;line-height:1.15}.hero p{opacity:.95;font-size:14px;margin-top:3px}
.crit{display:grid;grid-template-columns:32px 1fr 74px;gap:11px;align-items:center;padding:7px 0}
.crit .tile3d{width:32px;height:32px;border-radius:10px;font-weight:800;color:#fff;font-size:15px}
.line{height:6px;background:rgba(255,255,255,.12);border-radius:9px;margin-top:5px;overflow:hidden}.line i{display:block;height:100%;border-radius:9px}
.pts{font-weight:800;text-align:right}.pts span{color:var(--muted);font-weight:500;font-size:13px}
.why{padding:10px 14px;border-radius:16px;background:rgba(255,194,75,.11);border:1px solid rgba(255,194,75,.32);margin:7px 0 11px}.why b{color:var(--amber)}
.acts{display:flex;gap:10px}

.banner{border-radius:26px;padding:21px 28px;background:linear-gradient(105deg,#0E9F76,#3DD3A8 62%,#B4F6E0);display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;box-shadow:0 16px 38px rgba(18,185,129,.35)}
.banner h2{font-size:27px;font-weight:800;margin-bottom:3px}.banner .cta{padding:11px 22px;border-radius:99px;background:#fff;color:#0B7A5A;font-weight:800;display:inline-block;margin-top:10px}
.art{position:absolute;right:30px;top:-6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.st{display:flex;align-items:center;gap:14px;padding:15px 17px}.st b{font-size:27px;display:block;line-height:1.05;font-weight:800}.st span{color:var(--muted);font-size:13px}.st .tile3d{width:46px;height:46px;border-radius:15px}.st .tile3d svg{width:25px;height:25px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.f{padding:8px 15px;border-radius:99px;background:var(--glass);border:1px solid var(--edge);font-weight:600;font-size:14px}
.row{display:grid;grid-template-columns:44px 1.5fr .5fr .55fr 1.05fr .85fr .8fr;gap:10px;align-items:center;padding:7px 12px;border-radius:17px;margin-bottom:4px;background:rgba(255,255,255,.035)}
.row.head{background:none;color:var(--muted);font-size:13px;padding-block:1px}
.row.alert{background:linear-gradient(90deg,rgba(255,84,112,.2),rgba(255,84,112,.03));box-shadow:inset 0 0 0 1px rgba(255,84,112,.35)}
.row .tile3d{width:36px;height:36px;border-radius:11px}.row .tile3d svg{width:20px;height:20px}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(61,235,143,.17);color:var(--green)}
.tag.w{background:rgba(255,194,75,.18);color:var(--amber)}.tag.x{background:linear-gradient(95deg,#FF5470,#FF2D6B);color:#fff;box-shadow:0 4px 14px rgba(255,84,112,.5)}
.sc{display:flex;align-items:center;gap:8px;font-weight:800}.sc i{width:44px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;display:block}.sc i u{display:block;height:100%;border-radius:9px}
/* Апелляции */
.ap{display:grid;grid-template-columns:304px 1fr;gap:14px;flex:1;min-height:0}
.item{padding:12px 13px;border-radius:18px;margin-bottom:7px;display:flex;gap:11px;align-items:center}
.item.on{background:linear-gradient(100deg,rgba(168,85,247,.28),rgba(224,79,208,.08));box-shadow:inset 0 0 0 1.5px rgba(200,120,255,.65)}
.item small{color:var(--muted);display:block}
.flow{display:grid;grid-template-columns:1fr 32px 1fr;align-items:center;gap:8px;margin-bottom:11px}
.fbox{border-radius:18px;padding:12px 16px;background:rgba(255,255,255,.07)}.fbox span{font-size:13px;color:#D5DEDA;display:block}.fbox b{font-size:25px;font-weight:800}
.fbox.new{background:linear-gradient(110deg,#0FA57A,#35CFA3);box-shadow:0 10px 24px rgba(18,185,129,.35)}
.cmt{border-radius:16px;padding:10px 14px;margin-bottom:10px;background:linear-gradient(100deg,rgba(168,85,247,.2),rgba(224,79,208,.06));border:1px solid rgba(200,120,255,.32)}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:99px;padding:4px;margin-bottom:9px;width:330px}.seg b{flex:1;text-align:center;padding:8px;border-radius:99px}.seg b.on{background:linear-gradient(95deg,#0FB57C,#38E39B);color:#04261A}
.ta{background:rgba(255,255,255,.07);border-radius:16px;padding:10px 14px;color:#C4D0CB;margin-bottom:10px}
a{color:inherit;text-decoration:none}.row:not(.head){cursor:pointer}
/* Чек-листы */
.cl{display:grid;grid-template-columns:270px 1fr;gap:14px;flex:1;min-height:0}
.cr{display:grid;grid-template-columns:32px 1.6fr .75fr .45fr .4fr;gap:10px;align-items:center;padding:6px 12px;border-radius:15px;margin-bottom:4px;background:rgba(255,255,255,.035)}
.cr.head{background:none;color:var(--muted);font-size:13px;padding-block:0}
.cr .tile3d{width:30px;height:30px;border-radius:10px;font-weight:800}
.cr.open{background:linear-gradient(100deg,rgba(61,235,143,.16),rgba(61,235,143,.03));box-shadow:inset 0 0 0 1px rgba(61,235,143,.42)}
.steps{display:flex;gap:7px;margin:3px 0 7px 54px}.steps span{padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600}
/* Аналитика */
.an{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;flex:1;min-height:0}
.bg{display:grid;grid-template-columns:230px 1fr 62px;gap:12px;align-items:center;padding:7px 0}
.bg .line{height:12px;margin:0}.bg b{text-align:right}
.lang{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.lang div{border-radius:18px;padding:13px;text-align:center;box-shadow:inset 0 1px 1px #fff6}.lang b{display:block;font-size:26px;font-weight:800}.lang span{font-size:13px}
